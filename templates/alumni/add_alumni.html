{% extends "layouts/base.html" %}

{% block title %}
Add Alumni | AlumniConnect
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-lg border-0">

            <div class="card-header bg-primary text-white text-center">

                <h2 class="mb-0">
                    <i class="bi bi-person-plus-fill"></i>
                    Add New Alumni
                </h2>

            </div>

            <div class="card-body p-4">

                <form method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="name"
                                placeholder="Enter full name"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                placeholder="Enter email"
                                required>

                        </div>

                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Password</label>
                        <input
                            type="password"
                            class="form-control"
                            name="password"
                            placeholder="Create a password"
                            required>
                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Graduation Year
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="year"
                                placeholder="2024"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Department
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="department"
                                placeholder="Computer Science"
                                required>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Company
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="company"
                                placeholder="Google">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Designation
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="designation"
                                placeholder="Software Engineer">

                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Experience (Years)</label>
                            <input
                                type="number"
                                class="form-control"
                                name="experience"
                                min="0"
                                placeholder="e.g. 5">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Location</label>
                            <input
                                type="text"
                                class="form-control"
                                name="location"
                                placeholder="e.g. Bangalore">
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Professional Bio</label>
                        <textarea
                            class="form-control"
                            rows="4"
                            name="bio"
                            placeholder="Tell students about yourself..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">LinkedIn Profile</label>
                        <input
                            type="url"
                            class="form-control"
                            name="linkedin"
                            placeholder="https://linkedin.com/in/yourprofile">
                    </div>


                    <div class="mb-4">
                        <label class="form-label">GitHub Profile</label>
                        <input
                            type="url"
                            class="form-control"
                            name="github"
                            placeholder="https://github.com/username">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Skills</label>
                        <textarea
                            class="form-control"
                            rows="3"
                            name="skills"
                            placeholder="Python, Flask, SQL, AWS"></textarea>
                    </div>

                    <div class="d-flex justify-content-between">

                        <a href="/"
                           class="btn btn-secondary">

                            <i class="bi bi-arrow-left"></i>

                            Back

                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary">

                            <i class="bi bi-check-circle-fill"></i>

                            Save Alumni

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
